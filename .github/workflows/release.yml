name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to package a known RustSec vulnerability in a crates.io dependency
  # (cargo audit does not match git-pinned crates). /package step 6 checks the
  # same audit before tagging; this backstops it.
  audit:
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: audit
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=manual-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Verify version bump policy
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          new="${RELEASE_TAG#v}"
          IFS='.' read -r new_major new_minor new_patch <<<"$new"

          if prev_full=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${RELEASE_TAG}^" 2>/dev/null); then
            prev="${prev_full#v}"
            IFS='.' read -r prev_major prev_minor prev_patch <<<"$prev"
            echo "Previous tag: $prev_full"
          else
            echo "No previous tag — first release, skipping bump check."
            exit 0
          fi

          echo "New tag:      $RELEASE_TAG"

          if [ "$new_major" -gt "$prev_major" ]; then
            kind="major"
          elif [ "$new_major" -eq "$prev_major" ] && [ "$new_minor" -gt "$prev_minor" ]; then
            kind="minor"
          elif [ "$new_major" -eq "$prev_major" ] && [ "$new_minor" -eq "$prev_minor" ] && [ "$new_patch" -gt "$prev_patch" ]; then
            kind="patch"
          else
            echo "::error::Tag $RELEASE_TAG does not strictly succeed $prev_full"
            exit 1
          fi

          echo "Bump kind:    $kind"

          if [ "$kind" = "patch" ]; then
            exit 0
          fi

          # Minor/major bumps must close out the previous minor in CHANGELOG.md.
          # If any v${prev_major}.${prev_minor}.* entries are still in the live
          # CHANGELOG, they should have been moved to changelog-archive/ by the
          # agent running /package step 1. Backstops the pre-commit hook for
          # cases where it was bypassed or never installed.
          archive_pattern="^## v${prev_major}\.${prev_minor}\."
          if grep -qE "$archive_pattern" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still contains v${prev_major}.${prev_minor}.* entries — close out the previous minor first."
            echo "::error::Move those blocks into changelog-archive/CHANGELOG-${prev_major}.${prev_minor}.md and add a v${prev_major}.${prev_minor}.x line to the 'Older releases' footer (see .claude/skills/package/SKILL.md step 1)."
            echo "::error::Recover with:"
            echo "::error::  git push --delete origin $RELEASE_TAG && git tag -d $RELEASE_TAG"
            echo "::error::  # archive, commit, push, re-tag (annotated for minor/major)"
            exit 1
          fi

          marker="allow-${kind}-bump"
          body=$(git tag -l --format='%(contents)' "$RELEASE_TAG" || true)
          if printf '%s\n' "$body" | grep -Fq "$marker"; then
            echo "Authorization marker found: $marker"
            exit 0
          fi

          echo "::error::$kind bump from $prev_full to $RELEASE_TAG requires '$marker' in the annotated tag message body."
          echo "::error::Recover with:"
          echo "::error::  git push --delete origin $RELEASE_TAG && git tag -d $RELEASE_TAG"
          echo "::error::  git tag -a $RELEASE_TAG -m \"$marker: <reason>\" && git push origin $RELEASE_TAG"
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked: ship exactly the lockfile the audit job checked.
      - name: Build release
        run: cargo build --release --locked

      - name: Bundle Nokkvi.app
        run: ./scripts/bundle-macos.sh --no-build

      - name: Package DMG and ZIP
        env:
          TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/Nokkvi.app"
          STEM="nokkvi-${RELEASE_TAG}-${TRIPLE}"

          DMG_STAGE="target/release/bundle/dmg-root"
          rm -rf "$DMG_STAGE" "${STEM}.dmg" "${STEM}.zip"
          mkdir -p "$DMG_STAGE"
          ditto "$APP" "$DMG_STAGE/Nokkvi.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname Nokkvi -srcfolder "$DMG_STAGE" -ov -format UDZO "${STEM}.dmg"
          rm -rf "$DMG_STAGE"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "${STEM}.zip"

          shasum -a 256 "${STEM}.dmg" > "${STEM}.dmg.sha256"
          shasum -a 256 "${STEM}.zip" > "${STEM}.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokkvi-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: |
            nokkvi-${{ env.RELEASE_TAG }}-${{ matrix.target }}.dmg
            nokkvi-${{ env.RELEASE_TAG }}-${{ matrix.target }}.dmg.sha256
            nokkvi-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip
            nokkvi-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=manual-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nokkvi-${{ env.RELEASE_TAG }}-*
          merge-multiple: true
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            HEADER="[Unreleased]"
          else
            HEADER="$RELEASE_TAG"
          fi
          awk -v header="$HEADER" '
            BEGIN { prefix = "## " header }
            !found && (index($0, prefix " ") == 1 || $0 == prefix) { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---

          > **macOS first launch:** `Nokkvi.app` is ad-hoc signed (not notarized). If Gatekeeper blocks the first launch, run `xattr -dr com.apple.quarantine /Applications/Nokkvi.app` or right-click the app in Finder and choose **Open**.
          EOF
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create draft release (tag push)
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          draft: true
          allowUpdates: true
          bodyFile: release-notes.md
          artifacts: dist/nokkvi-${{ env.RELEASE_TAG }}-*
